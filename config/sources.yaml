  - id: gov_policy
    name: 中国政府网
    collector: gov_policy_api
    start_urls:
      - https://sousuo.www.gov.cn/zcwjk/policyDocumentLibrary
    api_url: https://sousuo.www.gov.cn/search-gov/data
    api_queries: [金融, 数据, 人工智能, 网络安全, 支付]
    api_max_candidates: 40
    required_context_keywords: [金融, 银行, 保险, 支付, 清算, 征信, 证券, 基金, 期货, 数字人民币]
    excluded_context_patterns:
      - 转移支付
      - 工资支付
      - 医保支付
      - 医疗费用支付
      - 财政支付
      - 预算支付
      - 对外支付税务
    allowed_domains: [www.gov.cn, sousuo.www.gov.cn]
    include_url_patterns:
      - /zhengce/
      - /zcwjk/
    exclude_url_patterns:
      - /hudong/
    source_weight: 5

