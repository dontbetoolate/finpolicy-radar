impact_templates:
  AI与大模型: 可能影响金融机构大模型、智能客服、智能风控或智能体应用的开发、测试、上线与持续治理。
  银行保险数字化: 可能影响银行保险机构的信息科技治理、数字化建设、外包管理或业务流程。
  数据治理: 可能影响数据分类分级、数据质量、数据授权使用、数据资产管理与监管报送。
  网络与信息安全: 可能影响个人信息保护、网络安全、数据安全评估、跨境传输或安全事件处置。
  数字人民币与支付: 可能影响支付产品、清算体系、数字人民币应用、支付机构或商户服务流程。
  监管科技: 可能影响监管报送、模型审计、算法治理、合规监测与监管检查准备。
  金融标准: 可能形成金融信息系统、接口、数据、身份认证或安全控制的新标准要求。
  五篇大文章: 可能影响科技金融、绿色金融、普惠金融、养老金融或数字金融相关产品与考核口径。
  证券与资本市场科技: 可能影响证券期货机构的信息系统、程序化交易、投资者保护或数据管理。
