name: Update FinPolicy Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - "LICENSE"

permissions:
  contents: write

concurrency:
  group: finpolicy-radar
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Crawl and build
        run: python -m src.finpolicy.radar
      - name: Persist policy data
        run: |
          git config user.name "finpolicy-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public
          git diff --cached --quiet || git commit -m "chore: update policy radar [skip ci]"
          git pull --rebase origin main
          git push origin main
